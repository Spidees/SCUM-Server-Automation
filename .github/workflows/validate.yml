name: Validate plugins

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.22.1 <25'
      - name: Validator self-test
        run: node plugins/tools/test-validate-plugins.js
      - name: Official plugins and examples
        run: node plugins/tools/validate-plugins.js plugins/ssa-plugins plugins/examples
      - name: Example plugin tests
        run: node plugins/examples/test-hello-plugin.js
