# Not published to PyPI. Install from a checkout with `pip install ./ssa_bridge/sdk/python`,
# or copy ssa_bridge_client.py next to your code. The version follows the bridge it was written for.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa-bridge-client"
version = "2.45.0"
description = "Reference client for the SSA Bridge, the SCUM server mod that answers JSON on a TCP socket."
readme = { text = "Reference client for the SSA Bridge. Documentation: https://scumsa.com/docs/dev/ssa-bridge-protocol", content-type = "text/plain" }
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.urls]
Documentation = "https://scumsa.com/docs/dev/ssa-bridge-protocol"

[tool.setuptools]
py-modules = ["ssa_bridge_client"]
